<!DOCTYPE html>
<html>
<head>
<meta
charset="utf-8">
<meta
name="viewport"
content="width=
device-width,
initial-scale=1.0">
<title>M</title>
<style>
body{
  background:#1e1e24;
  color:#fff;
  font-family:
    sans-serif;
  padding:5px;
  text-align:
    center;
}
h2{
  font-size:14px;
  margin:5px;
  color:#4fc3f7;
}
#info{
  font-size:12px;
  color:#ffeb3b;
  font-weight:bold;
  margin:5px;
}
.grid-container{
  position:relative;
  width:241px;
  margin:10px auto;
}
.grid{
  display:grid;
  grid-template-columns:
    repeat(5,45px);
  gap:4px;
  justify-content:
    center;
}
.cell{
  width:45px;
  height:45px;
  background:#333;
  font-size:24px;
  line-height:
    45px;
  border-radius:
    4px;
  position:relative;
}
.wall{
  background:#212121;
}
.char-layer{
  position:absolute;
  width:45px;
  height:45px;
  pointer-events:none;
  font-size:24px;
  line-height:45px;
  transition:
    left 0.4s ease,
    top 0.4s ease;
  z-index:100;
  left:0;
  top:0;
}
.bb{
  position:absolute;
  top:-22px;
  left:-15px;
  width:75px;
  background:#fff;
  color:#000;
  font-size:8px;
  font-weight:bold;
  border-radius:4px;
  line-height:12px;
  display:none;
  z-index:200;
}
.inp-box{
  margin-top:10px;
}
.inp{
  width:110px;
  font-size:12px;
  padding:4px;
}
.btn{
  font-size:11px;
  margin:2px;
  padding:5px;
}
.pad{
  font-size:18px;
  width:45px;
  height:40px;
}
</style>
</head>
<body>
<h2>🧭 旅人のオンライン迷路 🧭</h2>
<div id="info">散策中...</div>

<div class="grid-container">
<div class="grid" id="board"></div>
<div id="p1" class="char-layer">🦊<div id="myB" class="bb"></div></div>
<div id="bot0" class="char-layer">🤖<div id="bB0" class="bb"></div></div>
<div id="bot1" class="char-layer">👽<div id="bB1" class="bb"></div></div>
<div id="bot2" class="char-layer">👶<div id="bB2" class="bb"></div></div>
<div id="bot3" class="char-layer">🤡<div id="bB3" class="bb"></div></div>
</div>

<div>
<button class="btn pad" onclick="m(0,-1)">▲</button><br>
<button class="btn pad" onclick="m(-1,0)">◀</button>
<button class="btn pad" onclick="m(1,0)">▶</button><br>
<button class="btn pad" onclick="m(0,1)">▼</button>
</div>

<div class="inp-box">
<input type="text" id="cInp" class="inp" placeholder="チャットを入力...">
<button class="btn" onclick="sendFree()">送信</button>
<button class="btn" onclick="nextStage()" style="background:#00796b;color:#fff;">スキップ</button>
</div>

<script>
const boardEl=document.getElementById('board');
const infoEl=document.getElementById('info');
const pEl=document.getElementById('p1');
const myB=document.getElementById('myB');
const cInp=document.getElementById('cInp');

// 🛠️ コースの最奥にゴール(2)の「🏁」を再配置しました！
const COURSES = [
  "00000" + "11110" + "00002" + "01111" + "00000",
  "00002" + "11101" + "00000" + "01111" + "00000",
  "00000" + "11110" + "20010" + "11010" + "00000",
  "00000" + "01111" + "00012" + "11010" + "00000",
  "00002" + "11101" + "00000" + "11101" + "00000"
];

if(!sessionStorage.getItem('bNames')){
  sessionStorage.setItem('bNames', JSON.stringify(["ken","same","tarou","neko"]));
}
const names = JSON.parse(sessionStorage.getItem('bNames'));
const emojis = ["🤖","👽","👶","🤡"];

let p = {x:0, y:0, gx:4, gy:2};
let MAP_STR = "";
let bots = [];
let tickCount = 0;

function initGame(){
  MAP_STR = COURSES[Math.floor(Math.random() * 5)];
  p.x = 0; p.y = 0;
  
  // 🏁の位置を自動スキャンして記憶
  for(let i=0; i<25; i++){
    if(MAP_STR.charAt(i)=="2"){
      p.gx = i % 5; p.gy = Math.floor(i / 5);
    }
  }
  
  let total = Math.floor(Math.random() * 4) + 2; 
  infoEl.innerText = `このエリアには、あなた含め ${total} 人が滞在しています。`;
  
  bots = [];
  for(let i=0; i<4; i++){
    let bEl = document.getElementById(`bot${i}`);
    let bB = document.getElementById(`bB${i}`);
    
    if(i < total - 1){
      bEl.style.display = "block";
      bEl.style.opacity = "1";
      
      let randType = Math.random();
      let mode = "normal";
      
      if(randType < 0.25){
        mode = "fast";
      } else if(randType < 0.45){
        mode = "oya";
      }
      
      bots.push({
        id: i, name: names[i], emoji: emojis[i],
        x: Math.floor(Math.random()*5), 
        y: Math.floor(Math.random()*5),
        mode: mode,
        isAFK: false,
        el: bEl, bEl: bB
      });
      if(MAP_STR.charAt(bots[i].y * 5 + bots[i].x) === "1"){
        bots[i].x = 0; bots[i].y = 0;
      }
    } else {
      bEl.style.display = "none";
    }
  }
  drawGrid();
  syncPositions();
}

function ani(el, x, y){
  el.style.left = (x * 49) + "px";
  el.style.top = (y * 49) + "px";
}

function drawGrid(){
  let html="";
  for(let y=0; y<5; y++){
    for(let x=0; x<5; x++){
      let idx = y * 5 + x;
      let tile = MAP_STR.charAt(idx);
      // 🛠️ 2のマスを「🏁」にデザイン変更
      let char = tile=="2"?"🏁":"";
      let cName = tile=="1"?"cell wall":"cell";
      html+=`<div class="${cName}">${char}</div>`;
    }
  }
  boardEl.innerHTML=html;
}

function syncPositions(){
  ani(pEl, p.x, p.y);
  bots.forEach(b=>{ if(!b.isAFK) ani(b.el, b.x, b.y); });
}

function getOccupier(x, y, currentBotId){
  let res = null;
  bots.forEach(b=>{
    if(b.id !== currentBotId && b.x == x && b.y == y) res = b;
  });
  return res;
}

function m(dx, dy){
  let nx = p.x + dx; let ny = p.y + dy;
  if(nx>=0 && nx<5 && ny>=0 && ny<5){
    if(MAP_STR.charAt(ny * 5 + nx) !== "1"){
      let bOnTile = getOccupier(nx, ny, "");
      p.x = nx; p.y = ny;
      syncPositions();
      
      if(bOnTile && !bOnTile.isAFK && Math.random() < 0.4){
        setTimeout(()=>{ 
          let r = bOnTile.mode=="oya"?"しーっ":"お疲れ〜";
          showB(bOnTile.bEl, r); 
        }, 200);
      }
      
      // 🛠️ 【新機能】🏁の座標にキツネが触れた瞬間、自動で次ステージへワープ！
      if(p.x == p.gx && p.y == p.gy){
        setTimeout(()=>{
          nextStage();
        }, 300); // ゴールを踏んだ余韻を0.3秒だけ残して次へ
      }
    }
  }
}

function sendFree(){
  let text = cInp.value.trim();
  if(!text) return;
  showB(myB, text);
  cInp.value = "";
  bots.forEach(b=>{
    if(b.isAFK) return;
    setTimeout(()=>{
      let replies = ["のんびり〜", "道広いね", "次行く？", "お疲れ様です", "ヤッホー"];
      if(b.mode === "oya") replies = ["おやばれする", "こそこそ", "おきてる"];
      let r = replies[Math.floor(Math.random() * replies.length)];
      showB(b.bEl, r);
    }, 400 + Math.random() * 800);
  });
}

function showB(el, txt){
  el.innerText = txt; el.style.display = "block";
  setTimeout(()=>{ el.style.display = "none"; }, 1500);
}

function moveBot(b){
  if(b.isAFK) return;

  if(b.mode !== "fast" && tickCount % 2 !== 0){
    return;
  }

  if(b.mode === "oya" && Math.random() < 0.03){
    b.isAFK = true;
    showB(b.bEl, "あ、おやきた");
    setTimeout(()=>{
      showB(b.bEl, "ねる！");
      b.el.style.opacity = "0.4";
    }, 1000);
    return;
  }

  let dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
  let valid = [];
  dirs.forEach(d=>{
    let nx = b.x + d.x; let ny = b.y + d.y;
    if(nx>=0 && nx<5 && ny>=0 && ny<5){
      if(MAP_STR.charAt(ny * 5 + nx) !== "1") valid.push(d);
    }
  });
  
  if(valid.length > 0 && Math.random() < 0.75){
    let m = valid[Math.floor(Math.random() * valid.length)];
    b.x += m.x; b.y += m.y;
    
    if(b.x == p.x && b.y == p.y && Math.random() < 0.25){
      showB(b.bEl, b.mode=="oya"?"たんたん":"やあ 🦊");
    }
    
    let target = getOccupier(b.x, b.y, b.id);
    if(target && !target.isAFK && Math.random() < 0.20){
      let r = b.mode=="fast"?"急ぎ足〜":(b.mode=="oya"?"ばれるて":"お散歩中〜");
      showB(b.bEl, r);
      setTimeout(()=>{ showB(target.bEl, "まったり〜"); }, 400);
    }
    
    // 🛠️ ボットたちもたまに勝手に🏁を踏んで、次のエリアへ向かってフェードアウト消滅するリアルな演出
    if(b.x == p.gx && b.y == p.gy){
      b.isAFK = true; // 移動を停止
      showB(b.bEl, "次いくね〜");
      setTimeout(()=>{ b.el.style.opacity = "0"; }, 1000);
    }
  }
}

function nextStage(){
  initGame();
}

window.addEventListener('keydown', e=>{
  if(e.key=='ArrowUp') m(0,-1); if(e.key=='ArrowLeft') m(-1,0);
  if(e.key=='ArrowRight') m(1,0); if(e.key=='ArrowDown') m(0,1);
});

initGame();
setInterval(()=>{
  tickCount++;
  bots.forEach(b=>moveBot(b));
  syncPositions();
}, 600);
</script>
</body>
</html>
