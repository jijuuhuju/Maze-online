<!DOCTYPE html>
<html>
<head>
<meta
charset="utf-8">
<meta
name="viewport"
content="width=
device-width,
initial-scale=1.0">
<title>M</title>
<style>
body{
  background:#1e1e24;
  color:#fff;
  font-family:
    sans-serif;
  padding:5px;
  text-align:
    center;
}
h2{
  font-size:16px;
  margin:5px;
  color:#4fc3f7;
}
#info{
  font-size:13px;
  color:#ffeb3b;
  font-weight:bold;
  margin:5px;
}
.grid{
  display:grid;
  grid-template-columns:
    repeat(5,45px);
  gap:4px;
  justify-content:
    center;
  margin:10px auto;
  position:relative;
  width:241px;
}
.cell{
  width:45px;
  height:45px;
  background:#fff;
  font-size:24px;
  line-height:
    45px;
  border-radius:
    4px;
  position:relative;
}
.wall{
  background:#37474f;
}
.bb{
  position:absolute;
  top:-22px;
  left:-15px;
  width:75px;
  background:#fff;
  color:#000;
  font-size:8px;
  font-weight:bold;
  border-radius:4px;
  line-height:12px;
  display:none;
  z-index:200;
}
.inp-box{
  margin-top:10px;
}
.inp{
  width:120px;
  font-size:12px;
  padding:4px;
}
.btn{
  font-size:11px;
  margin:2px;
  padding:5px;
}
.pad{
  font-size:18px;
  width:45px;
  height:40px;
}
</style>
</head>
<body>
<h2>🏁 迷路野良マルチ 🏁</h2>
<div id="info">マッチ中...</div>

<div style="
position:relative;
display:inline-block;">
<div class="grid" id="board"></div>
<div id="p1" class="char-layer">👨<div id="myB" class="bb"></div></div>
<div id="bot0" class="char-layer">🤖<div id="bB0" class="bb"></div></div>
<div id="bot1" class="char-layer">👽<div id="bB1" class="bb"></div></div>
<div id="bot2" class="char-layer">👶<div id="bB2" class="bb"></div></div>
<div id="bot3" class="char-layer">🤡<div id="bB3" class="bb"></div></div>
</div>

<div>
<button class="btn pad" onclick="m(0,-1)">▲</button><br>
<button class="btn pad" onclick="m(-1,0)">◀</button>
<button class="btn pad" onclick="m(1,0)">▶</button><br>
<button class="btn pad" onclick="m(0,1)">▼</button>
</div>

<div class="inp-box">
<input type="text" id="cInp" class="inp" placeholder="チャットを入力...">
<button class="btn" onclick="sendFree()">送信</button>
<button class="btn" onclick="location.reload()" style="background:#558b2f;color:#fff;">次コース</button>
</div>

<script>
const boardEl=document.getElementById('board');
const infoEl=document.getElementById('info');
const pEl=document.getElementById('p1');
const myB=document.getElementById('myB');
const cInp=document.getElementById('cInp');

const COURSES = [
  "00000" + "11110" + "00002" + "01111" + "00000",
  "00002" + "11101" + "00000" + "01111" + "00000",
  "00000" + "11110" + "20010" + "11010" + "00000",
  "00000" + "01111" + "00012" + "11010" + "00000",
  "00002" + "11101" + "00000" + "11101" + "00000"
];

let over = 0;
let p = {x:0, y:0, gx:4, gy:2};

const MAP_STR = COURSES[Math.floor(Math.random() * 5)];

for(let i=0; i<25; i++){
  if(MAP_STR.charAt(i)=="2"){
    p.gx = i % 5; p.gy = Math.floor(i / 5);
  }
}

const names=["ken","same","tarou","neko"];
const total = Math.floor(Math.random() * 4) + 2; 
infoEl.innerText = `${total}人マッチに接続しました！`;

let bots = [];
for(let i=0; i<4; i++){
  let bEl = document.getElementById(`bot${i}`);
  let bB = document.getElementById(`bB${i}`);
  if(i < total - 1){
    let type = Math.floor(Math.random() * 3);
    bots.push({
      name: names[i], x: 0, y: 0, type: type, out: 0, el: bEl, bEl: bB
    });
  } else {
    bEl.style.display = "none";
  }
}

function ani(el, x, y){
  el.style.left = (x * 49) + "px";
  el.style.top = (y * 49) + "px";
}

function drawGrid(){
  let html="";
  for(let y=0; y<5; y++){
    for(let x=0; x<5; x++){
      let idx = y * 5 + x;
      let tile = MAP_STR.charAt(idx);
      let char = tile=="2"?"🎁":"";
      let cName = tile=="1"?"cell wall":"cell";
      html+=`<div class="${cName}">${char}</div>`;
    }
  }
  boardEl.innerHTML=html;
}

function syncPositions(){
  ani(pEl, p.x, p.y);
  bots.forEach(b=>{
    if(!b.out) ani(b.el, b.x, b.y);
  });
}

// 🛠️ ボット同士の重なり判定（あなたは除外）
function isBotAt(x, y){
  let found = false;
  bots.forEach(b=>{
    if(!b.out && b.x == x && b.y == y) found = true;
  });
  return found;
}

function getOccupier(x, y){
  let res = null;
  bots.forEach(b=>{
    if(!b.out && b.x == x && b.y == y) res = b;
  });
  return res;
}

function m(dx, dy){
  if(over) return;
  let nx = p.x + dx; let ny = p.y + dy;
  if(nx>=0 && nx<5 && ny>=0 && ny<5){
    if(MAP_STR.charAt(ny * 5 + nx) !== "1"){
      // 🛠️ あなた（👨）はすり抜け可能なので衝突判定を完全スルー！
      let bOnTile = getOccupier(nx, ny);
      p.x = nx; p.y = ny;
      syncPositions();
      
      // 🛠️ すり抜けた瞬間、ボットが驚く演出
      if(bOnTile){
        setTimeout(()=>{
          showB(bOnTile.bEl, "わ！抜かれた");
        }, 200);
      }
      
      if(p.x==p.gx && p.y==p.gy) win("👨 あなたの勝ち！");
    }
  }
}

function sendFree(){
  let text = cInp.value.trim();
  if(!text) return;
  showB(myB, text);
  cInp.value = "";
  
  bots.forEach(b=>{
    if(b.out) return;
    setTimeout(()=>{
      let replies = ["おk！", "わおｗ", "了解です", "なるほど", "あ、はい"];
      if(b.type === 0) replies = ["それよりRTA", "おつ", "おk"];
      if(b.type === 2) replies = ["？？", "あわわ", "むずい"];
      
      let r = replies[Math.floor(Math.random() * replies.length)];
      showB(b.bEl, r);
    }, 400 + Math.random() * 800);
  });
}

function showB(el, txt){
  el.innerText = txt; el.style.display = "block";
  setTimeout(()=>{ el.style.display = "none"; }, 1500);
}

function moveBot(b){
  if(over || b.out) return;
  let dist = Math.abs(b.x - p.gx) + Math.abs(b.y - p.gy);
  if(b.type === 1 && dist === 1 && p.x !== p.gx){
    if(Math.random()<0.3) showB(b.bEl, "お先にどうぞ");
    return;
  }
  
  let ox = b.x; let oy = b.y;
  
  if(b.type === 2 && Math.random() < 0.45){
    let r = Math.random();
    if(r<0.25) b.x++; else if(r<0.5) b.x--; else if(r<0.75) b.y++; else b.y--;
  } else {
    if(b.x < p.gx && checkW(b.x+1, b.y)) b.x++;
    else if(b.x > p.gx && checkW(b.x-1, b.y)) b.x--;
    else if(b.y < p.gy && checkW(b.x, b.y+1)) b.y++;
    else if(b.y > p.gy && checkW(b.x, b.y-1)) b.y--;
    else {
      let r = Math.random();
      if(r<0.25) b.x++; else if(r<0.5) b.x--; else if(r<0.75) b.y++; else b.y--;
    }
  }
  
  fixWall(b);
  
  // 🛠️ ボット同士（AI同士）の時だけ、これまで通り衝突させて喧嘩させる
  if((b.x !== ox || b.y !== oy) && isBotAt(b.x, b.y)){
    if(b.x !== p.gx || b.y !== p.gy){
      let target = getOccupier(b.x, b.y);
      if(target && Math.random() < 0.35){
        showB(b.bEl, "そこ邪魔！");
        setTimeout(()=>{ showB(target.bEl, "は？あっち行って"); }, 600);
      }
      b.x = ox; b.y = oy; 
    }
  }
  
  if(b.x==p.gx && b.y==p.gy){
    b.out = 1; b.el.style.opacity = "0";
    win(`💀 ライバルの勝ち！`);
  }
}

function checkW(x, y){
  if(x<0||x>4||y<0||y>4) return false;
  return MAP_STR.charAt(y * 5 + x) !== "1";
}

function fixWall(b){
  if(b.x<0)b.x=0; if(b.x>4)b.x=4; if(b.y<0)b.y=0; if(b.y>4)b.y=4;
  if(MAP_STR.charAt(b.y * 5 + b.x) === "1"){ b.x = 0; b.y = 0; }
}

function win(msg){
  if(over) return; over = 1; infoEl.innerText = "🏁 " + msg;
}

drawGrid();
syncPositions();
setInterval(()=>{
  if(!over){
    bots.forEach(b=>moveBot(b));
    syncPositions();
  }
}, 1000);
</script>
</body>
</html>
